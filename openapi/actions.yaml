openapi: 3.1.0
info:
  title: Raymond Fashion Shopping API
  description: >
    REST fallback for platforms that use OpenAPI-based "Actions" instead of
    native MCP (e.g. a ChatGPT Custom GPT built without Developer Mode).
    Points at the same backend logic as the MCP server. Prefer connecting
    via MCP directly wherever it's supported.
  version: "1.0.0"
servers:
  - url: https://your-deployed-domain.com/api
paths:
  /categories:
    get:
      operationId: browseCategories
      summary: List all Raymond fashion collections
      responses:
        "200":
          description: List of categories
  /products/search:
    get:
      operationId: searchProducts
      summary: Search products by query, category, color, size, price, or brand
      parameters:
        - name: query
          in: query
          schema: { type: string }
        - name: category_slug
          in: query
          schema: { type: string }
        - name: color
          in: query
          schema: { type: string }
        - name: size
          in: query
          schema: { type: string }
        - name: min_price
          in: query
          schema: { type: number }
        - name: max_price
          in: query
          schema: { type: number }
        - name: brand
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Matching products with variants
  /products/{product_id}:
    get:
      operationId: getProductDetails
      summary: Get full details and size variants for a product
      parameters:
        - name: product_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Product details
  /products/{product_id}/stock:
    get:
      operationId: checkStock
      summary: Check size/stock availability for a product
      parameters:
        - name: product_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: size
          in: query
          schema: { type: string }
        - name: quantity
          in: query
          schema: { type: integer }
      responses:
        "200":
          description: Stock availability
  /orders:
    post:
      operationId: createOrder
      summary: >
        Hold stock, create/reuse a guest customer by email, apply any
        eligible discount, and generate a Razorpay payment link. The
        response's payment_link is what you hand back to the shopper — the
        order confirms itself automatically once Razorpay's webhook reports
        it paid, no separate confirm call needed in normal use.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items, customer_email]
              properties:
                items:
                  type: array
                  items:
                    type: object
                    required: [variant_id, quantity]
                    properties:
                      variant_id: { type: string, format: uuid }
                      quantity: { type: integer }
                customer_email: { type: string, format: email }
                customer_name: { type: string }
                customer_phone: { type: string }
                shipping_address: { type: object }
                discount_code: { type: string }
                source_client: { type: string }
      responses:
        "200":
          description: Pending order created, includes payment_link to send the shopper
  /orders/{order_id}/confirm:
    post:
      operationId: confirmPayment
      summary: >
        Manually finalize an order. Not needed in normal use since orders
        auto-confirm via the /webhooks/razorpay route once paid — this is
        for local testing without a public webhook URL, or reconciling a
        payment whose webhook didn't arrive.
      parameters:
        - name: order_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [payment_ref]
              properties:
                payment_ref:
                  type: string
                  description: Razorpay payment id (starts "pay_")
      responses:
        "200":
          description: Order confirmed
